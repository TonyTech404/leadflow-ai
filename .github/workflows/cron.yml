name: Scheduled jobs

# Drives the background work on the live demo: retrying CRM syncs that are due, firing
# "no reply" automations, and removing sandboxes nobody has opened for two weeks.
# (A Cloudflare Cron Trigger would do the same; this account's cron slots are in use.)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -sf -X POST https://leadflow.buildwithanthony.com/api/cron \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
